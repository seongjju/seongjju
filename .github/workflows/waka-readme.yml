name: Waka Readme

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  update-readme:
    name: Update this repo's README with commit stats
    runs-on: ubuntu-latest
    steps:
      - uses: mahyarmirrashed/action-github-readme-stats@main
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TIMEZONE: 'Asia/Seoul'
          FEATURES: 'DAY_STATS'
