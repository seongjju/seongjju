name: Waka Readme

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  update-readme:
    name: Update this repo's README with commit stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README
        uses: mahyarmirrashed/action-github-readme-stats@main
        with:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          TIMEZONE: 'Asia/Seoul'
          FEATURES: 'DAY_STATS'

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update README with commit stats"
          git push
